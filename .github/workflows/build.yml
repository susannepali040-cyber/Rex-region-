name: Build Rex Region GBA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build GBA ROM
        run: make

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: Rex_Region_GBA
          path: rex_region.gba
